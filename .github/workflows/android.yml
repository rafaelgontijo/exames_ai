name: Android
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install required Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - name: Rebuild and stage pinned private PDF adapter
        run: |
          curl --fail --location --retry 2 --output "$RUNNER_TEMP/pdfium-core.aar" https://repo.maven.apache.org/maven2/io/legere/pdfiumandroid-core/2.0.1/pdfiumandroid-core-2.0.1.aar
          python3 tools/pdf/rebuild_jni.py --sdk "$ANDROID_HOME" --core-aar "$RUNNER_TEMP/pdfium-core.aar" --engine-lock validation/pdf/engine.lock.json
          python3 tools/pdf/stage_core.py
      - name: Run Python tooling tests
        run: python3 -m unittest discover -s tools/litert -p 'test_*.py'
      - name: Build lightweight APK and run unit tests
        run: |
          ./gradlew assembleDebug test :app:assembleDebugAndroidTest :ui-checks:compileDebugAndroidTestKotlin --no-daemon
          ./gradlew :app:dependencies --configuration debugRuntimeClasspath --no-daemon > "$RUNNER_TEMP/runtime-dependencies.txt"
          python3 tools/verify_android_artifact.py \
            --apk app/build/outputs/apk/debug/app-debug.apk \
            --manifest app/build/intermediates/merged_manifest/debug/processDebugMainManifest/AndroidManifest.xml \
            --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt" \
            --dependencies "$RUNNER_TEMP/runtime-dependencies.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            domain/build/reports/tests/
            app/build/reports/
            data-private-pdf/build/reports/
            inference-local/build/reports/
            inference-cloud/build/reports/
            pdf-spike/build/native-rebuild/build-report-2.json

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
      - name: Run Lambda stateless proxy & privacy-log tests
        run: python3 -m unittest discover -s backend/lambda -p 'test_*.py' -v
      - name: Validate OpenAPI contract and SCP JSON
        run: |
          python3 -c "import json, pathlib; assert json.loads(pathlib.Path('backend/infra/scp-regional-pinning.example.json').read_text())['Version'] == '2012-10-17'"
          ruby -ryaml -e "doc = YAML.load_file('backend/openapi/vision-fallback-v1.yaml'); raise 'invalid openapi' unless doc['openapi'] == '3.1.0' && doc['paths'].key?('/v1/vision/extract')"
      - name: Validate Terraform infrastructure
        run: |
          terraform -chdir=backend/infra fmt -check -diff
          terraform -chdir=backend/infra init -backend=false -input=false
          terraform -chdir=backend/infra validate
