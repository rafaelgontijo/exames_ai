openapi: 3.1.0
info:
  title: Meu Exame — Private Cloud Vision Fallback API
  version: 1.0.0
  description: >
    Stateless HTTPS proxy backed by Amazon Bedrock (google.gemma-4-e2b) used only
    as an explicit opt-in fallback when on-device Gemma 4 E2B inference is unavailable.
    Payloads are processed strictly in memory with zero persistence, Model Invocation
    Logging disabled, and sanitized technical-only observability.
servers:
  - url: https://{apiId}.execute-api.{region}.amazonaws.com
    variables:
      apiId:
        default: example-api-id
      region:
        default: us-east-1
        enum:
          - us-east-1
          - sa-east-1
paths:
  /v1/vision/extract:
    post:
      operationId: extractExamBand
      summary: Extract structured documentary items from a single exam page band
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisionExtractRequest'
      responses:
        '200':
          description: Unvalidated structured JSON output from google.gemma-4-e2b
          headers:
            Cache-Control:
              schema:
                type: string
                enum: ['no-store']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisionExtractResponse'
        '400':
          description: Invalid contract version, MIME type, or malformed request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid bearer JWT token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated caller is not authorized for this resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Request body (> 1 MiB) or decoded image (> 512 KiB) exceeds size limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Client rate limit or Bedrock throttling exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Upstream Bedrock inference error or empty model response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Upstream Bedrock inference timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    VisionExtractRequest:
      type: object
      additionalProperties: false
      required:
        - promptVersion
        - schemaVersion
        - instruction
        - documentText
        - imageMimeType
        - imageBase64
      properties:
        promptVersion:
          type: string
          enum:
            - exam-vision/1
        schemaVersion:
          type: string
          enum:
            - exam-vision-items/1
        instruction:
          type: string
          minLength: 1
          maxLength: 6000
          description: Exact system/extraction instruction shared with local LiteRT-LM Gemma 4 E2B.
        documentText:
          type: string
          maxLength: 20000
          description: Optional band context text (empty string when image-only).
        imageMimeType:
          type: string
          enum:
            - image/png
            - image/jpeg
        imageBase64:
          type: string
          format: byte
          minLength: 4
          maxLength: 700000
          description: Base64-encoded PNG or JPEG band image (decoded size MUST be <= 524288 bytes / 512 KiB). Digital PDFs have local opaque PII redaction applied on-device prior to encoding.
    VisionExtractResponse:
      type: object
      required:
        - text
        - usage
        - latencyMs
      properties:
        text:
          type: string
          description: Final JSON text generated by google.gemma-4-e2b matching exam-vision-items/1.
        usage:
          type: object
          required:
            - inputTokens
            - outputTokens
          properties:
            inputTokens:
              type: integer
              minimum: 0
            outputTokens:
              type: integer
              minimum: 0
        latencyMs:
          type: integer
          format: int64
          minimum: 0
    ErrorResponse:
      type: object
      required:
        - errorCode
        - message
        - requestId
      properties:
        errorCode:
          type: string
        message:
          type: string
          description: Operational error summary only; never echoes request payload, image bytes, or clinical text.
        requestId:
          type: string
